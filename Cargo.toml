[package]
name = "lite-grpc"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lite-grpc"
path = "src/main.rs"

[dependencies]
# HTTP server
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# gRPC client
tonic = "0.13"
prost = "0.13"
prost-types = "0.13"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Tokenizer
tokenizers = { version = "0.21", features = ["http"] }
zip = "2"
sha2 = "0.10"
tempfile = "3"
hf-hub = { version = "0.5", features = ["tokio"] }

# Chat template rendering
minijinja = { version = "2", features = ["builtins"] }

# Utilities
uuid = { version = "1", features = ["v7"] }
anyhow = "1"
regex = "1"
futures = "0.3"

[build-dependencies]
tonic-build = "0.13"
